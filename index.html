  .split, .camera-grid, .edit-grid { grid-template-columns: minmax(0, 1fr); }
  .qrbox { min-height: 190px; }
  .camera-wrap { width: 100%; aspect-ratio: 3 / 4; max-height: 55dvh; }
  .camera-wrap video { object-fit: cover; }
  .camera-side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }
  .camera-side .control, .camera-side .callout { grid-column: 1 / -1; }

  .thumbs { gap: 8px; }

  .template-card { padding: 8px; }

  .editor-controls .btnrow { display: grid; grid-template-columns: 1fr 1fr; }
  .receipt { padding: 22px 16px; }
  .receipt-photos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .digital-options { grid-template-columns: 1fr; }
  .digital-card { display: grid; grid-template-columns: 40px 1fr; text-align: left; align-items: center; gap: 0 8px; }
  .digital-card > div { grid-row: span 3; }
  .digital-card strong, .digital-card small { margin: 2px 0; }
  .digital-card button { grid-column: 2; }
  .btnrow { gap: 8px; }
  .btnrow .btn { min-height: 48px; }
  .modal { width: min(100%, 650px); }
  .admin-grid { grid-template-columns: 1fr; }
}
@media (orientation: portrait) and (max-width: 480px) {
  .app { padding: 8px; }
  .topbar { font-size: .82rem; }
  .panel { padding: 16px; border-radius: 20px; }

  .art { min-height: 175px; }
  .brandname { font-size: clamp(2.8rem, 13vw, 4rem); }
  .tagline { font-size: 1rem; }

}

function openAssetDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB is not available'));return;}const req=indexedDB.open(HIRAYA_ASSET_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(HIRAYA_ASSET_STORE))req.result.createObjectStore(HIRAYA_ASSET_STORE);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open image storage'));});}

function layoutPaperRatio(){const opt=selectedLayoutConfig();const size=String(opt.photoSize||'').toLowerCase().replace(/\s/g,'');const orientation=String(opt.orientation||'portrait').toLowerCase();let ratio='2 / 3';const match=size.match(/(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)/)||size.match(/(\d+(?:\.\d+)?)×(\d+(?:\.\d+)?)/);if(match){const a=Number(match[1]),b=Number(match[2]);if(a>0&&b>0)ratio=`${Math.min(a,b)} / ${Math.max(a,b)}`;}else if(size.includes('square'))ratio='1 / 1';else if(size.includes('2r'))ratio='5 / 7';else if(size.includes('3r'))ratio='7 / 10';else if(size.includes('4r')||size.includes('4x6')||size.includes('4×6'))ratio='2 / 3';else if(size.includes('5r'))ratio='5 / 7';else if(size.includes('6r'))ratio='3 / 4';else if(size.includes('a6'))ratio='105 / 148';if(orientation==='landscape'&&ratio!=='1 / 1'){const parts=ratio.split('/').map(Number);ratio=`${parts[1]} / ${parts[0]}`;}return ratio;}
function getLayoutTitle(){const opt=(settings.layoutOptions||[]).find(x=>x.id===state.layout);return opt?.name||({polaroid:'Polaroid',shot2:'2 Shots',shot3:'3 Shots',shot4:'4 Shots',strip:'Photo Strip'})[state.layout]||'Photo Strip';}
function render(){
 const miniBrand=$('#miniBrand'); if(miniBrand) miniBrand.textContent=settings.brand;
 const prog={welcome:'A little moment, made forever',layouts:'Choose your keepsake',payment:'One tiny step before the fun',camera:'Ready, smile!',templates:'Make it yours',editor:'Your photos, your way',receipt:'Thanks for making a memory'}[state.screen]||'Hiraya Snaps';
 const progressLabel=$('#progressLabel'); if(progressLabel) progressLabel.textContent=prog;
 const root=$('#appScreen');
 const views={welcome:welcomeView,layouts:layoutsView,payment:paymentView,camera:cameraView,templates:templatesView,editor:editorView,receipt:receiptView};
 root.innerHTML=(views[state.screen]||welcomeView)();
 if(state.screen==='camera') attachCamera();

}

function start(){state.shots=[];state.paymentDone=false;state.paymentReference='';state.cashCode='';state.paymentSessionId='';state.paymentSuccessShownSession='';state.paymentSubmitted=false;detachCustomerPaymentListener();state.paymentMode=settings.boothMode==='rental'?'rental':'paid';state.sessionPrice=0;setScreen('layouts');}
function layoutsView(){const opts=(settings.layoutOptions||[]).filter(o=>o&&o.id&&o.name);return `<section class="panel"><div class="section-head"><div><div class="eyebrow">step 1 · pick your keepsake</div><h1>PICK YOUR LAYOUT</h1><p class="subtitle">Choose the photo format that feels like you.</p></div></div>
 <div class="cards">${opts.map(o=>{const id=String(o.id),name=String(o.name||'Layout'),count=Math.max(1,Math.min(12,Number(o.photoCount)||(id==='polaroid'?1:id==='shot2'?2:id==='shot3'?3:4))),artClass=id==='strip'?'strip':id==='polaroid'?'polaroid':'',sizes=Array.isArray(o.photoSizes)?o.photoSizes.filter(Boolean):[],guide=o.layoutGuideImage||'',ratio=(()=>{const z=String(o.photoSize||'4R').toLowerCase().replace(/\s/g,'');let r=z.includes('square')?'1 / 1':z.includes('2r')?'5 / 7':z.includes('3r')?'7 / 10':z.includes('5r')?'5 / 7':z.includes('6r')?'3 / 4':z.includes('a6')?'105 / 148':'2 / 3';if(String(o.orientation||'portrait')==='landscape'&&r!=='1 / 1'){const a=r.split('/').map(Number);r=`${a[1]} / ${a[0]}`;}return r;})();return `<button class="choice layout-choice ${state.layout===id?'selected':''}" onclick="HS.chooseLayout('${esc(id)}')"><div class="layout-art ${artClass}" style="aspect-ratio:${ratio};${guide?`background-image:url('${guide}');background-size:contain;background-position:center;background-repeat:no-repeat;`:''}">${guide?'':Array.from({length:count},()=>'<span class="tile"></span>').join('')}</div><div class="layout-card-text"><strong>${esc(name)}</strong><small>${esc(o.description||(id==='polaroid'?'One big keepsake':id==='strip'?'Classic booth strip':`${count} photo${count===1?'':'s'} layout`))}</small>${sizes.length?`<span class="layout-photo-sizes">${sizes.map(size=>esc(size)).join(' · ')}</span>`:''}</div></button>`;}).join('')}</div>
 ${opts.length?'':'<p class="callout">No layouts are available yet. Please ask the owner to add and save a layout in the Control Room.</p>'}
 <div class="btnrow"><button class="btn secondary" onclick="HS.home()">Cancel session</button><button class="btn primary" onclick="HS.continuePayment()" ${opts.length?'':'disabled'}>CONTINUE →</button></div></section>`;}
function chooseLayout(id){state.layout=id;state.shotCount=photoCount();state.shots=(state.shots||[]).slice(0,photoCount());state.slotPositions=(state.slotPositions||[]).slice(0,photoCount());state.sessionPrice=priceFor(id);const opt=(settings.layoutOptions||[]).find(x=>x.id===id);if(opt)settings.printMorePrice=Number(opt.printMorePrice||0);render();}
function continuePayment(){if(settings.boothMode==='rental'){state.sessionPrice=0;state.paymentMode='rental';state.paymentDone=true;state.shots=[];state.currentShot=0;setScreen('camera');return;}state.sessionPrice=priceFor(state.layout);state.paymentMode='paid';state.paymentDone=false;state.paymentStatus='pending';state.paymentSubmitted=false;state.paymentSessionId='';state.paymentSuccessShownSession='';detachCustomerPaymentListener();state.paymentStartedAt=new Date().toISOString();setScreen('payment');}

 const enabled=settings.paymentMethods||{cash:true,qrph:true};
 const available=['cash','qrph'].filter(m=>enabled[m]);
 if(!available.length){return `<section class="panel payment-panel"><div class="eyebrow">step 2 · payment</div><h1>Payment is not configured</h1><p class="subtitle">Please ask the booth owner to enable Cash or QR Ph in owner settings.</p><div class="btnrow payment-actions"><button class="btn secondary" onclick="HS.home()">Cancel</button></div></section>`;}
 if(!available.includes(state.paymentMethod))state.paymentMethod=available[0];
 const method=state.paymentMethod;

async function capture(){const video=$('#cameraVideo');if(!video||!video.videoWidth){toast('Camera is still starting. Please wait a moment.');return;}const btn=$('#captureBtn');if(btn.disabled)return;btn.disabled=true;const counter=$('#countdown');const seconds=Number(settings.countdown||3);for(let n=seconds;n>0;n--){counter.textContent=n;counter.classList.remove('hidden');await new Promise(r=>setTimeout(r,1000));}counter.classList.add('hidden');const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;const ctx=c.getContext('2d');const zoom=state.zoom;const sw=c.width/zoom,sh=c.height/zoom;ctx.drawImage(video,(c.width-sw)/2,(c.height-sh)/2,sw,sh,0,0,c.width,c.height);playShutter();state.shots[state.currentShot]=c.toDataURL('image/jpeg',.92);if(!state.shotMirrors)state.shotMirrors=[];if(typeof state.shotMirrors[state.currentShot]!=='boolean')state.shotMirrors[state.currentShot]=false;let next=-1;for(let i=state.currentShot+1;i<photoCount();i++){if(!state.shots[i]){next=i;break;}}if(next<0){for(let i=0;i<photoCount();i++){if(!state.shots[i]){next=i;break;}}}if(next>=0){state.currentShot=next;render();setTimeout(()=>capture(),350);}else{state.currentShot=photoCount()-1;render();setTimeout(()=>{state.selectedTemplate=0;state.slotPositions=[];setScreen('templates');},500);}}

function setupEditor(){
 const canvas=$('#designCanvas');if(!canvas)return;
 canvas.querySelectorAll('.photo-slot').forEach(slot=>{
  let drag=null;const pointers=new Map();let pinchStart=null;
  const idx=()=>Number(slot.dataset.slot);
  const apply=()=>{const i=idx(),p=state.slotPositions[i],img=slot.querySelector('img');if(img)img.style.transform=`translate(${p.x}px,${p.y}px) scale(${p.scale}) scaleX(${state.shotMirrors?.[i]?-1:1})`;};
  const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  slot.addEventListener('pointerdown',e=>{
   const i=idx();state.activeSlot=i;slot.classList.add('active-slot');pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
   if(pointers.size===1)drag={x:e.clientX,y:e.clientY,px:state.slotPositions[i].x,py:state.slotPositions[i].y};
   else if(pointers.size===2){const pts=[...pointers.values()];pinchStart={distance:Math.max(1,distance(pts[0],pts[1])),scale:state.slotPositions[i].scale};drag=null;}
   try{slot.setPointerCapture(e.pointerId);}catch{}
  });
  slot.addEventListener('pointermove',e=>{
   if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const i=idx();
   if(pointers.size>=2){const pts=[...pointers.values()];if(!pinchStart)pinchStart={distance:Math.max(1,distance(pts[0],pts[1])),scale:state.slotPositions[i].scale};state.slotPositions[i].scale=Math.max(1,Math.min(2.5,pinchStart.scale*distance(pts[0],pts[1])/pinchStart.distance));apply();}
   else if(drag){state.slotPositions[i].x=drag.px+(e.clientX-drag.x);state.slotPositions[i].y=drag.py+(e.clientY-drag.y);apply();}
  });
  const finish=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=null;if(!pointers.size)drag=null;};
  slot.addEventListener('pointerup',finish);slot.addEventListener('pointercancel',finish);
  slot.addEventListener('wheel',e=>{e.preventDefault();const p=state.slotPositions[idx()];p.scale=Math.max(1,Math.min(2.5,p.scale+(e.deltaY<0?.1:-.1)));apply();},{passive:false});
 });
}

async function boomerang(){if(!state.shots.length){toast('Take photos first.');return;}if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){toast('This browser does not support in-browser video export.');return;}try{const c=document.createElement('canvas');c.width=640;c.height=800;const ctx=c.getContext('2d');const s=c.captureStream(12);const rec=new MediaRecorder(s,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='hiraya-snaps-boomerang.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Boomerang video saved as WebM.');};rec.start();const frames=state.shots.slice(0,photoCount());const seq=[...frames,...frames.slice(0,-1).reverse()];for(let pass=0;pass<2;pass++){for(const src of seq){const img=new Image();img.src=src;await img.decode();ctx.fillStyle='#fffaf3';ctx.fillRect(0,0,c.width,c.height);const scale=Math.min(c.width/img.width,c.height/img.height);const w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);await new Promise(r=>setTimeout(r,180));}}rec.stop();}catch(e){toast('Video export failed in this browser. Try Chrome desktop.');}}
function setPaymentMethod(method){const enabled=settings.paymentMethods||{cash:true,qrph:true};if(!enabled[method]){toast('That payment method is currently disabled.');return;}state.paymentMethod=method==='cash'?'cash':'qrph';state.paymentSubmitted=false;state.paymentStatus='pending';detachCustomerPaymentListener();render();}

function submitQrPayment(){if((state.paymentMethod||'qrph')!=='qrph')return;state.paymentSessionId=state.paymentSessionId||('hs_'+Date.now()+'_'+Math.random().toString(36).slice(2,9));state.paymentSubmitted=true;state.paymentStatus='pending';const payload={id:state.paymentSessionId,method:'qrph',status:'pending',date:state.paymentStartedAt||new Date().toISOString(),layout:state.layout,layoutName:getLayoutTitle(),amount:Number(state.sessionPrice||0),updatedAt:firebase.database.ServerValue.TIMESTAMP};activePaymentRequest=payload;activePaymentRef.set(payload).then(()=>{detachCustomerPaymentListener();customerPaymentListenerRef=activePaymentRef;customerPaymentListenerRef.on('value',snap=>{const req=snap.val();if(!req||req.id!==state.paymentSessionId)return;state.paymentStatus=req.status||'pending';if(req.status==='received'){if(state.paymentSuccessShownSession===state.paymentSessionId)return;state.paymentSuccessShownSession=state.paymentSessionId;state.paymentDone=true;state.paymentMode='paid';detachCustomerPaymentListener();showPaymentReceivedPopup(()=>setScreen('camera'));}else if(req.status==='rejected'){state.paymentSubmitted=false;toast('Payment was rejected. Please check with the owner and try again.');render();}});}).catch(e=>{state.paymentSubmitted=false;state.paymentStatus='pending';render();toast('Could not submit payment. Please check the connection and try again.');});render();toast('Checking payment....');}
async function enterCashCode(){const entered=String(state.cashCode||'').trim().toUpperCase();if(!entered){toast('Please enter your Cash Code.');return;}const codes=String(settings.cashCodes||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const matched=codes.find(x=>x.toUpperCase()===entered);if(!matched){toast('wrong cash code');return;}const txRef=completedTransactionsRef.push();const tx={id:txRef.key,date:state.paymentStartedAt||new Date().toISOString(),layoutName:state.layout||'—',amount:Number(state.sessionPrice||priceFor(state.layout)||0),method:'Cash',status:'received',completedAt:Date.now()};try{await txRef.set(tx);}catch(e){toast('Cash Code is valid, but payment could not be saved. Check connection and try again.');return;}settings.cashCodes=codes.filter(x=>x.toUpperCase()!==entered).join('\\n');saveSettings();state.paymentDone=true;state.paymentMode='paid';state.cashCode='';toast('Cash Code accepted.');setScreen('camera');if(fbAuth.currentUser)saveSharedSettings().catch(()=>toast('Cash Code accepted; cloud settings sync failed.'));}
function ownerReceivePayment(){const q=activePaymentRequest;if(!q||q.method!=='qrph'||!q.id||!['pending','rejected'].includes(q.status)){toast('There is no QR Ph payment waiting for confirmation.');return;}if(!confirm('Confirm that you have received and verified the QR Ph payment?'))return;const tx={id:q.id,date:q.date||new Date().toISOString(),layoutName:q.layoutName||q.layout||'—',amount:Number(q.amount||0),method:'QR Ph',status:'received',completedAt:Date.now()};completedTransactionsRef.child(String(q.id).replace(/[.#$\[\]\/]/g,'_')).once('value').then(snap=>snap.exists()?null:completedTransactionsRef.child(String(q.id).replace(/[.#$\[\]\/]/g,'_')).set(tx)).then(()=>activePaymentRef.update({status:'received',updatedAt:firebase.database.ServerValue.TIMESTAMP})).then(()=>{activePaymentRequest={...q,status:'received'};state.paymentStatus='received';toast('PAYMENT RECEIVED — moved to Completed Transactions');renderOwnerPaymentDetails();}).catch(()=>toast('Could not confirm payment. Check the connection and owner access.'));}
function ownerRejectPayment(){const q=activePaymentRequest;if(!q||q.method!=='qrph'||!q.id||!['pending','rejected'].includes(q.status)){toast('There is no QR Ph payment waiting for confirmation.');return;}if(!confirm('Reject this QR Ph payment? The customer will remain on the payment step.'))return;activePaymentRef.update({status:'rejected',updatedAt:firebase.database.ServerValue.TIMESTAMP}).then(()=>{activePaymentRequest={...q,status:'rejected'};state.paymentStatus='rejected';toast('PAYMENT REJECTED — customer can retry.');renderOwnerPaymentDetails();}).catch(()=>toast('Could not reject payment. Check the connection and owner access.'));}

function uploadTemplateAsset(key,input){const file=input?.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Please choose an image file.');input.value='';return;}if(file.size>3*1024*1024){toast('Please choose an image smaller than 3 MB.');input.value='';return;}const reader=new FileReader();reader.onload=()=>{const i=Number($('#editTemplate')?.value);if(!templates[i])return;templates[i][key]=String(reader.result||'');const map={backgroundImage:'designBackgroundThumb',photoElement:'designPhotoThumb',frameImage:'designFrameThumb'};const thumb=$('#'+map[key]);if(thumb){thumb.src=templates[i][key];thumb.style.display='block';}if(key==='backgroundImage')updateTemplatePreview();if(key==='photoElement'){const ph=$('#previewPhoto');if(ph)ph.innerHTML=`<img src="${templates[i][key]}" alt="Photo element">`;}if(key==='frameImage'){const preview=$('#templateLivePreview');let img=preview?.querySelector('.preview-frame-img');if(!img&&preview){img=document.createElement('img');img.className='preview-frame-img';img.alt='Frame overlay';preview.appendChild(img);}if(img)img.src=templates[i][key];}toast('Image added to template preview. Click Save Template to keep changes.');};reader.onerror=()=>toast('Could not read that image.');reader.readAsDataURL(file);}

async function unlockAdmin(){

async function addCashCode(){

 const code=String(input?.value||'').trim();
 if(!code){toast('Please enter a Cash Code to save.');return;}
 const codes=String(settings.cashCodes||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
